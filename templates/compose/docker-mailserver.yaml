# documentation: https://docker-mailserver.github.io/docker-mailserver/latest/
# slogan: A production-ready fullstack but simple mail server with SMTP, IMAP, LDAP, Antispam, Antivirus, and more.
# category: email
# tags: email,mailserver,smtp,imap,pop3,antispam,antivirus,self-hosted
# logo: svgs/docker-mailserver.svg
# port: 587

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    hostname: ${MAIL_HOSTNAME:-mail.example.com}
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - OVERRIDE_HOSTNAME=${MAIL_HOSTNAME:-mail.example.com}
      - POSTMASTER_ADDRESS=${POSTMASTER_ADDRESS:-postmaster@example.com}
      - ENABLE_AMAVIS=${ENABLE_AMAVIS:-1}
      - ENABLE_SPAMASSASSIN=${ENABLE_SPAMASSASSIN:-1}
      - ENABLE_CLAMAV=${ENABLE_CLAMAV:-0}
      - ENABLE_FAIL2BAN=${ENABLE_FAIL2BAN:-1}
      - ENABLE_POSTGREY=${ENABLE_POSTGREY:-0}
      - ENABLE_SASLAUTHD=${ENABLE_SASLAUTHD:-0}
      - ENABLE_QUOTAS=${ENABLE_QUOTAS:-1}
      - ENABLE_MANAGESIEVE=${ENABLE_MANAGESIEVE:-1}
      - ENABLE_POP3=${ENABLE_POP3:-0}
      - ENABLE_UPDATE_CHECK=${ENABLE_UPDATE_CHECK:-0}
      - ENABLE_DNSBL=${ENABLE_DNSBL:-0}
      - ENABLE_RSPAMD=${ENABLE_RSPAMD:-0}
      - ENABLE_MTA_STS=${ENABLE_MTA_STS:-0}
      - ENABLE_DANE=${ENABLE_DANE:-0}
      - ENABLE_IMAP=${ENABLE_IMAP:-1}
      - ENABLE_SMTP=${ENABLE_SMTP:-1}
      - ENABLE_SUBMISSION=${ENABLE_SUBMISSION:-1}
      - ENABLE_SUBMISSIONS=${ENABLE_SUBMISSIONS:-1}
      - ENABLE_AUTODISCOVER=${ENABLE_AUTODISCOVER:-1}
      - ENABLE_AUTOCONFIG=${ENABLE_AUTOCONFIG:-1}
      - ENABLE_AUTOREPLY=${ENABLE_AUTOREPLY:-1}
      - ENABLE_FETCHMAIL=${ENABLE_FETCHMAIL:-0}
      - ENABLE_GETMAIL=${ENABLE_GETMAIL:-0}
      - ENABLE_SIEVE=${ENABLE_SIEVE:-1}
      - SSL_TYPE=${SSL_TYPE:-letsencrypt}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-/etc/letsencrypt/live/${MAIL_HOSTNAME:-mail.example.com}/fullchain.pem}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-/etc/letsencrypt/live/${MAIL_HOSTNAME:-mail.example.com}/privkey.pem}
      - SSL_ALT_CERT_PATH=${SSL_ALT_CERT_PATH:-/etc/letsencrypt/live/${MAIL_HOSTNAME:-mail.example.com}/fullchain.pem}
      - SSL_ALT_KEY_PATH=${SSL_ALT_KEY_PATH:-/etc/letsencrypt/live/${MAIL_HOSTNAME:-mail.example.com}/privkey.pem}
      - TLS_LEVEL=${TLS_LEVEL:-intermediate}
      - SPOOF_PROTECTION=${SPOOF_PROTECTION:-1}
      - PERMIT_DOCKER=${PERMIT_DOCKER:-none}
      - NETWORK_INTERFACE=${NETWORK_INTERFACE:-eth0}
      - POSTFIX_MESSAGE_SIZE_LIMIT=${POSTFIX_MESSAGE_SIZE_LIMIT:-10240000}
      - POSTFIX_MAILBOX_SIZE_LIMIT=${POSTFIX_MAILBOX_SIZE_LIMIT:-0}
      - DOVECOT_MAILBOX_SIZE_LIMIT=${DOVECOT_MAILBOX_SIZE_LIMIT:-0}
      - VIRUSMAILS_DELETE_DELAY=${VIRUSMAILS_DELETE_DELAY:-7}
      - ENABLE_SRS=${ENABLE_SRS:-0}
      - SRS_DOMAINNAME=${SRS_DOMAINNAME:-${MAIL_HOSTNAME:-mail.example.com}}
      - SRS_EXCLUDE_DOMAINS=${SRS_EXCLUDE_DOMAINS:-}
      - SRS_SECRET=${SRS_SECRET:-}
      - ENABLE_OPENDKIM=${ENABLE_OPENDKIM:-1}
      - ENABLE_OPENDMARC=${ENABLE_OPENDMARC:-1}
      - ENABLE_POLICYD_SPF=${ENABLE_POLICYD_SPF:-1}
    ports:
      - '25:25'
      - '143:143'
      - '465:465'
      - '587:587'
      - '993:993'
    volumes:
      - 'mailserver-mail-data:/var/mail/'
      - 'mailserver-mail-state:/var/mail-state/'
      - 'mailserver-mail-logs:/var/log/mail/'
      - 'mailserver-config:/tmp/docker-mailserver/'
      - 'mailserver-letsencrypt:/etc/letsencrypt/'
      - '/etc/localtime:/etc/localtime:ro'
    restart: always
    stop_grace_period: 1m
    cap_add:
      - NET_ADMIN
    healthcheck:
      test:
        - CMD-SHELL
        - 'ss --listening --tcp | grep -P ''LISTEN.+:smtp'' || exit 1'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mailserver-mail-data:
  mailserver-mail-state:
  mailserver-mail-logs:
  mailserver-config:
  mailserver-letsencrypt:
